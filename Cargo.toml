[package]
name = "ups-panel"
version = "1.2.0"
edition = "2021"

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_System_IO",
  "Win32_System_Shutdown",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_System_Diagnostics_Debug",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_System_Time",
  "Win32_Graphics_Dwm",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Registry",
  "Win32_Globalization",
  "Win32_Storage_Xps",
]

[dependencies.rusqlite]
version = "0.32"
features = ["bundled"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
embed-resource = "3"
